<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7E8F1" />
    <meta
      name="description"
      content="Азалия — цветочный магазин: нежные авторские букеты, букеты на заказ и именные ленты."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Цветочный магазин Азалия</title>
    <!-- Применяем сохранённую (или системную) тему до первой отрисовки, чтобы не было «вспышки» -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('azalia-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
